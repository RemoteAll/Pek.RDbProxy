<!DOCTYPE html>
<html lang="zh-cn" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pek.RDbProxy 管理面板</title>
<link rel="stylesheet" href="/assets/app.css?v=5">
</head>
<body>

<div id="login" class="login-box glass-card">
<h1><span class="emoji">🔐</span> Pek.RDbProxy 管理面板</h1>
<p class="sub">请输入凭据以继续</p>
<label>用户名</label>
<input id="luser" placeholder="请输入用户名" autocomplete="username" autofocus>
<label>密码</label>
<input id="lpass" type="password" placeholder="请输入密码" autocomplete="current-password">
<label class="remember"><input type="checkbox" id="lremember" checked><span>保持登录（此设备免密）</span></label>
<button class="btn btn-primary btn-lg" style="width:100%;margin-top:8px" onclick="doLogin()">登 录</button>

<div id="lerr" class="err"></div>
</div>

<div id="app">
<header class="glass">
<div class="logo">
<div class="dot" id="status-dot-header"></div>
<h1 id="header-title">Pek.RDbProxy 管理面板</h1>
<span class="meta" id="header-meta"></span>
</div>
<div style="display:flex;align-items:center;gap:10px">
<button class="btn btn-ghost btn-sm" id="theme-toggle" onclick="toggleTheme()" title="切换浅色/深色主题">🌓</button>
<button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
</div>
</header>

<nav id="nav-bar" class="glass">
<a data-panel="overview" class="active">📊 概览</a>
<a data-panel="audit">📋 SQL 审计</a>
<a data-panel="settings">⚙ 设置</a>
</nav>

<div id="sec-banner" class="sec-banner hidden"></div>

<main>
<div id="panel-overview" class="panel active"></div>
<div id="panel-audit" class="panel"></div>
<div id="panel-settings" class="panel"></div>
</main>
</div>

<footer id="srv-foot" class="srv-foot">Pek.RDbProxy · 服务端处理耗时：-- ms（最近一次请求）</footer>

<div id="modal-overlay" class="modal-overlay hidden">
 <div class="modal-box" id="modal-box">
<h3 id="modal-title"></h3>
<div id="modal-body" style="font-size:13px;color:var(--text-secondary);margin-bottom:22px;line-height:1.6"></div>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">取消</button>
<button class="btn btn-primary" id="modal-confirm-btn" onclick="confirmModal()">确认</button>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script src="/assets/app.js?v=5"></script>
</body>
</html>
